{% extends "base.html" %}

{% block title %}Internal Atelier Error (500) — BookWise{% endblock %}

{% block content %}
<div class="atelier-container" style="max-width: 600px; padding: 5rem 0; text-align: center;">
  <div class="atelier-card empty-state" style="padding: 3rem 2rem;">
    <div class="empty-state-icon">⚙️</div>
    <h1 style="font-family: var(--font-serif); font-size: 2.2rem; margin-bottom: 8px;">Atelier Disruption</h1>
    <p style="color: var(--color-text-secondary); margin-bottom: 2rem;">
      An unexpected internal condition occurred. Our curators have been notified and order shall be restored shortly.
    </p>
    <a href="{{ url_for('main.index') }}" class="btn-atelier btn-atelier-primary">Return Home</a>
  </div>
</div>
{% endblock %}
