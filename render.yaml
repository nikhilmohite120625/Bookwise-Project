services:
  - type: web
    name: bookwise-atelier
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn run:app"
    healthCheckPath: /health
    plan: free
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bookwise-db
          property: connectionString
      - key: RATELIMIT_STORAGE_URI
        value: memory://

databases:
  - name: bookwise-db
    databaseName: bookwise_db
    user: bookwise_user
    plan: free
